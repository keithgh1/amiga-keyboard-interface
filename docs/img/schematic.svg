<text class="p" x="888" y="488">2N3906 + 100 Ω from +5 V</text>
<text class="s" x="888" y="504">on while the power LED is lit</text>
<line x1="744" y1="548" x2="880" y2="548" stroke="#111827" stroke-width="1.6"/>
<text class="p" x="888" y="552">2N3906 + 100 Ω from +5 V</text>
<text class="s" x="888" y="568">on while the DF0 motor runs</text>
<text class="s" x="40" y="640">D8–D10 are open-drain: PORT bits stay 0 and the firmware only switches DDR (output = pull low, input = release).</text>
<text class="s" x="40" y="658">Internal pull-ups are never enabled; the motherboard's 10k pull-ups (RP501) set the high level.</text>
<text class="s" x="40" y="676">R4/R6 and R5/R7 divide the ~5 V LED drive to ~2.5 V for the ADC. Real keyboard unplugged from CN13.</text>
